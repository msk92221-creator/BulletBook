name: Android widget update checks
on:
  push:
    branches: [codex/widget-period-bars]
  pull_request:
    paths:
      - 'android/**'
      - 'family-calendar/**'
      - '.github/workflows/widget-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Calendar regression checks
        run: |
          npm run test:inbox
          npm run test:sync
          npm run test:windows-host
          npm run test:category-colors
          npm run test:day-agenda
          npm run test:family
          npm run test:family-connection
          npm run test:widget-snapshot
          npm run test:widget-startup
      - name: Build web assets and keep patched Android runtime
        run: |
          npm run build:web
          cp android/capacitor.settings.gradle /tmp/bulletbook-capacitor.settings.gradle
          npx cap sync android
          cp /tmp/bulletbook-capacitor.settings.gradle android/capacitor.settings.gradle
      - name: Compile APK and run Android tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: BulletBook-0.43.1-unsigned-for-verification
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
